<!doctype html>
<html lang="ko">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<script>
			// Light or dark, decided before anything is painted: the reader's choice if they made
			// one (the theme tab in a chapter, src/lib/theme.svelte.js), else the system's.
			(function () {
				var saved = null;
				try {
					saved = localStorage.getItem('svelte-inside:theme');
				} catch (e) {}
				var dark =
					saved === 'dark' ||
					(saved !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
				document.documentElement.dataset.theme = dark ? 'dark' : 'light';
			})();
		</script>
		%sveltekit.head%
		<script>
			// Keep the page hidden until the fonts of its first screen are in (at most 3s, the
			// same as `font-display: block`), so it never shows half drawn: highlighter marks
			// without their words. Entrance animations wait too (app.css). After a first layout,
			// the faces the page uses are loading, and `fonts.ready` waits for those.
			(function () {
				var root = document.documentElement;
				var show = function () {
					root.classList.remove('fonts-wait');
				};
				root.classList.add('fonts-wait');
				setTimeout(show, 3000);
				if (!document.fonts) return show();
				document.addEventListener('DOMContentLoaded', function () {
					requestAnimationFrame(function () {
						document.fonts.ready.then(show);
					});
				});
			})();
		</script>
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
